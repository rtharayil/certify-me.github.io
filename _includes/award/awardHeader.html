<header>
    <style>
        header {
            background-image: url('{{page.BGImagelink}}');
            color: black;
        }
        header .award-header-subheading {
            font-size: 24px;
            font-weight: 500;
            line-height: 1.1;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        header .award-header-description {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.1;
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
    <div class="header-content">
        <div class="header-content-inner ;">
            <h1>{{page.Head1}}</h1>
            
            <div>
                <h2 class="award-header-subheading">{% if page.archived %}Award Programme Archive{% else %}{{page.Head2}}{% endif %}</h2>

                <p class="award-header-description">{% if page.archived %}{{ site.data.award_archive[page.url].summary }}{% else %}{{page.Head3}}{% endif %}</p>
            </div>
            <a href="{% if page.archived %}https://info.certifyme.online/request-demo{% else %}#form{% endif %}" class="btn btn-primary btn-xl page-scroll" style="margin-top: 20px">{% if page.archived %}Ask About Current Programmes{% else %}{{page.HeadCTA}}{% endif %}</a>
        </div>
    </div>
</header>
