   <!--====== ABOUT PART START ======-->
    
   <section id="about" class="about-area pt-70">
<style>
.about-area {
    position: relative;
    overflow: hidden;
}
.about-area .about-shape-1 img {
    max-width: 100%;
    height: auto;
}
.about-area .about-image img {
    max-width: 100%;
    height: auto;
}
@media (max-width: 767px) {
    .text {
      margin-left: 10px; } 
  
      .section-title{
        margin-left: 10px; } 
      
        .small{
          width :50%;
          margin-top :20px
        }
    
    }</style>
    <div class="container" >
        <div class="row">
            <div class="col-lg-6">
                <div class="about-content mt-50 wow fadeInLeftBig" data-wow-duration="1s" data-wow-delay="0.5s" style="margin-left: 10px;">
                    <div class="section-title">
                        <div class="line"></div>
                        <h2 class="title">{{page.About}}</h2>
                       
                    </div> <!-- section title -->
                    <p class="text">{% if page.archived %}{{ site.data.award_archive[page.url].about }}{% else %}{{page.About1}}{% endif %}</p>
                    <a href="{% if page.archived %}https://info.certifyme.online/request-demo{% else %}#form{% endif %}" class="main-btn">{% if page.archived %}Ask About Current Programmes{% else %}Nominate{% endif %}</a>
                </div> <!-- about content --> 
            </div>	
            <div class="col-lg-6">
                <div class="about-image text-center mt-50 wow fadeInRightBig" data-wow-duration="1s" data-wow-delay="0.5s">
                    <img class= "small" src= "{{page.AboutImg}}" alt="about">
                </div> <!-- about image -->
            </div>
        </div> <!-- row -->
    </div> <!-- container -->
    <div class="about-shape-1" aria-hidden="true">
        <img src="/assets/images/about-shape-1.svg" alt="">
    </div>
</section>

<!--====== ABOUT PART ENDS ======-->





<!--====== ABOUT PART ENDS ======-->
