<style>
    .blog-faq-section {
        margin-top: 50px;
        padding-top: 40px;
        border-top: 1px solid #e6e6f0;
    }

    .blog-faq-section .faq-heading {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 24px;
        color: #14142b;
    }

    .blog-faq-item {
        border: 1px solid #e6e6f0;
        border-radius: 12px;
        margin-bottom: 14px;
        overflow: hidden;
        background: #fff;
    }

    .blog-faq-question {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 22px;
        cursor: pointer;
        font-size: 17px;
        font-weight: 600;
        color: #14142b;
        list-style: none;
    }

    .blog-faq-question::-webkit-details-marker {
        display: none;
    }

    .blog-faq-question::after {
        content: "+";
        font-size: 22px;
        font-weight: 400;
        color: #4A6CF7;
        flex-shrink: 0;
        transition: transform 0.2s ease;
    }

    .blog-faq-item[open] .blog-faq-question::after {
        transform: rotate(45deg);
    }

    .blog-faq-answer {
        padding: 0 22px 20px;
        font-size: 16px;
        line-height: 1.7;
        color: #4b4b63;
    }
</style>

<div class="blog-faq-section">
    <h2 class="faq-heading">Frequently Asked Questions</h2>

    {% for faq in include.faqs %}
    <details class="blog-faq-item">
        <summary class="blog-faq-question">{{ faq.question }}</summary>
        <div class="blog-faq-answer">{{ faq.answer | markdownify }}</div>
    </details>
    {% endfor %}
</div>
