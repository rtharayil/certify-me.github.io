<!-- RELATED ARTICLES (compact sidebar cards) -->
{% assign related_posts = include.related_posts %}
{% if related_posts.size > 0 %}
<div class="sidebar-card related-card">
    <p class="sidebar-card-title">Related articles</p>

    {% for rp in related_posts %}
    <a href="{{ site.baseurl }}{{ rp.url }}" class="related-article-item">
        <div class="related-article-img">
            <img src="{{ rp.imageLink }}" alt="{{ rp.title }}">
        </div>
        <div class="related-article-txt">
            <span class="post-tag color--blue-400">Blog</span>
            <p class="related-article-title">{{ rp.title }}</p>
            <span class="related-article-readtime">{{ rp.content | number_of_words | divided_by: 200 | plus: 1 }} min read</span>
        </div>
    </a>
    {% endfor %}

    <a href="{{ site.baseurl }}/blog" class="view-all-link">View all articles <span class="flaticon-next"></span></a>
</div>
{% endif %}
