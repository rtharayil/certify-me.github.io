<head>

  <!-- CHARACTER ENCODING — must be first -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SECURITY HEADERS (Phase 8) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">

  <!-- TITLE & CORE META -->
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="CertifyMe">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#4A6CF7">
  {% if page.seo_keywords %}<meta name="keywords" content="{{ page.seo_keywords | escape }}">{% endif %}

  <!-- CANONICAL URL -->
  <link rel="canonical" href="https://www.certifyme.online{{ page.url }}">

  <!-- OPEN GRAPH -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="CertifyMe">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{% if page.abstract and page.abstract != '' %}{{ page.abstract }}{% else %}{{ page.description }}{% endif %}">
  <meta property="og:url" content="https://www.certifyme.online{{ page.url }}">
  {% if page.imageLink %}
  <meta property="og:image" content="https://www.certifyme.online{{ page.imageLink }}">
  {% else %}
  <meta property="og:image" content="https://www.certifyme.online/assets4/images/Images%20Webp/digital%20credential%20software.webp">
  {% endif %}
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ page.title }}">
  {% if page.date %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}
  <meta property="article:publisher" content="https://www.facebook.com/certifyme.online">

  <!-- TWITTER CARD -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@me_certify">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{% if page.abstract and page.abstract != '' %}{{ page.abstract }}{% else %}{{ page.description }}{% endif %}">
  {% if page.imageLink %}
  <meta name="twitter:image" content="https://www.certifyme.online{{ page.imageLink }}">
  {% else %}
  <meta name="twitter:image" content="https://www.certifyme.online/assets4/images/Images%20Webp/digital%20credential%20software.webp">
  {% endif %}

  <!-- FAVICON AND TOUCH ICONS -->
  <link rel="shortcut icon" href="/assets4/images/Logo/CertifyMe-LOGO.jpg" type="image/jpeg">
  <link rel="icon" href="/assets4/images/Logo/CertifyMe-LOGO.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets4/images/Logo/CertifyMe-LOGO.jpg">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets4/images/Logo/CertifyMe-LOGO.jpg">
  <link rel="apple-touch-icon" sizes="76x76" href="/assets4/images/Logo/CertifyMe-LOGO.jpg">
  <link rel="apple-touch-icon" href="/assets4/images/Logo/CertifyMe-LOGO.jpg">

  <!-- RESOURCE HINTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">

  <!-- GOOGLE TAG MANAGER -->
  {% include V4NewLook/_GTMScript.html %}

  <!-- GOOGLE FONTS — consolidated into one request -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- BOOTSTRAP CSS -->
  <link rel="stylesheet" href="/assets4/css/bootstrap.min.css">

  <!-- FONT ICONS -->
  <link href="/assets4/css/flaticon.css" rel="stylesheet">

  <!-- PLUGINS STYLESHEET -->
  <link href="/assets4/css/menu.css" rel="stylesheet">
  <link id="effect" href="/assets4/dropdown-effects/fade-down.css" media="all" rel="stylesheet">
  <link href="/assets4/css/magnific-popup.css" rel="stylesheet">
  <link href="/assets4/css/owl.carousel.min.css" rel="stylesheet">
  <link href="/assets4/css/owl.theme.default.min.css" rel="stylesheet">
  <link href="/assets4/css/lunar.css" rel="stylesheet">

  <!-- ON SCROLL ANIMATION -->
  <link href="/assets4/css/animate.css" rel="stylesheet">

  <!-- TEMPLATE CSS -->
  <link href="/assets4/css/blue-theme.css" rel="stylesheet">

  <!-- RESPONSIVE CSS -->
  <link href="/assets4/css/responsive.css" rel="stylesheet">

  <!-- STRUCTURED DATA: BlogPosting -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.certifyme.online/#organization",
        "name": "CertifyMe",
        "url": "https://www.certifyme.online",
        "description": "Verifiable digital credential software for educational institutions and enterprises.",
        "foundingDate": "2020",
        "logo": "https://www.certifyme.online/assets4/images/logo.webp",
        "sameAs": [
          "https://www.linkedin.com/company/certify-me-online/",
          "https://twitter.com/me_certify",
          "https://www.g2.com/products/certifyme",
          "https://www.capterra.com/p/certifyme"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+1-252-500-1225",
          "contactType": "sales"
        },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "166 Geary St. STE 1500 #2686",
          "addressLocality": "San Francisco",
          "addressRegion": "CA",
          "postalCode": "94108",
          "addressCountry": "US"
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://www.certifyme.online/#website",
        "name": "CertifyMe",
        "url": "https://www.certifyme.online",
        "publisher": { "@id": "https://www.certifyme.online/#organization" }
      },
      {
        "@type": "BlogPosting",
        "@id": "https://www.certifyme.online{{ page.url }}#article",
        "headline": {{ page.title | jsonify }},
        "description": {{ page.description | jsonify }},
        {% if page.imageLink %}
        "image": {
          "@type": "ImageObject",
          "url": "https://www.certifyme.online{{ page.imageLink }}"
        },
        {% else %}
        "image": {
          "@type": "ImageObject",
          "url": "https://www.certifyme.online/assets4/images/Images%20Webp/digital%20credential%20software.webp"
        },
        {% endif %}
        "datePublished": "{{ page.date | date_to_xmlschema }}",
        "dateModified": "{{ page.date | date_to_xmlschema }}",
        "author": {
          "@type": "Person",
          "name": "{% if page.author %}{{ page.author }}{% else %}CertifyMe Team{% endif %}"
        },
        "publisher": { "@id": "https://www.certifyme.online/#organization" },
        "isPartOf": { "@id": "https://www.certifyme.online/#website" },
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": "https://www.certifyme.online{{ page.url }}"
        },
        "inLanguage": "en-US"
      }
    ]
  }
  </script>

</head>
