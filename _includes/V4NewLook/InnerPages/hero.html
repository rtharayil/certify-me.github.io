<!-- FEATURE PAGE HERO — split layout matching homepage hero-7
                        ============================================= -->
<section id="hero-7" class="gr--perl hero-section fp-hero">
    <div class="hero-overlay">
        <div class="container">
            <div class="row d-flex align-items-center">

                <!-- HERO TEXT -->
                <div class="col-md-6">
                    <div class="hero-7-txt wow fadeInUp">

                        <!-- Title -->
                        <h1 class="s-42 w-700" style="padding-bottom: 20px;">{{page.HeroTitle}}</h1>

                        <!-- Text -->
                        <p class="p-lg">{{page.HeroText}}
                        </p>

                        <!-- Buttons -->
                        <div class="btns-group mt-4">
                            <a href="https://info.certifyme.online/request-demo" target="_blank"
                                class="btn r-04 btn--theme hover--black" rel="noopener noreferrer">Request a Demo</a>
                        </div>

                        <!-- Advantages List -->
                        <ul class="advantages ico-15 mt-25 clearfix">
                            <li>
                                <p>No credit card required</p>
                            </li>
                            <li class="advantages-links-divider">
                                <p><span class="flaticon-minus"></span></p>
                            </li>
                            <li>
                                <p>Cancel it anytime</p>
                            </li>
                            <li class="advantages-links-divider">
                                <p><span class="flaticon-minus"></span></p>
                            </li>
                            <li>
                                <p>Free 7 days trial</p>
                            </li>
                        </ul>

                    </div>
                </div> <!-- END HERO TEXT -->

                <!-- HERO IMAGE -->
                <div class="col-md-6">
                    <div class="hero-7-img fp-hero-img text-center wow fadeInUp">
                        <img class="img-fluid" src="{{page.HeroImage | default: page.BoxImage}}" alt="{{page.HeroTitle}}" loading="eager" fetchpriority="high">
                    </div>
                </div> <!-- END HERO IMAGE -->

            </div> <!-- End row -->
        </div> <!-- End container -->
    </div> <!-- End hero-overlay -->
</section> <!-- END HERO-7 -->

<!-- BOX CONTENT
                        ============================================= -->
<section id="lnk-1" class="pt-40 ws-wrapper content-section">
    <div class="container">
        <div class="bc-1-wrapper fp-box-wrapper r-16">
            <div class="section-overlay">
                <div class="row d-flex align-items-center">


                    <!-- TEXT BLOCK -->
                    <div class="col-md-6 order-last order-md-2">
                        <div class="txt-block left-column wow fadeInRight">

                            <!-- Title -->
                            <h2 class="s-38 w-700">{{page.BoxContentTitle}}</h2>

                            <!-- Text -->
                            <p class="s-18">{{page.BoxContentText}}
                            </p>

                            <!-- Link -->
                            <div class="txt-block-tra-link mt-25">
                                <a href="https://info.certifyme.online/request-demo" target="_blank"
                                    class="tra-link ico-20 color--theme" rel="noopener noreferrer">
                                    Request a Demo <span class="flaticon-next"></span>
                                </a>
                            </div>

                        </div>
                    </div> <!-- END TEXT BLOCK -->


                    <!-- IMAGE BLOCK -->
                    <div class="col-md-6 order-first order-md-2">
                        <div class="img-block right-column fp-box-img wow fadeInLeft">
                            <img class="img-fluid" src="{{page.BoxImage}}" alt="{{page.BoxContentTitle}}" loading="lazy">
                        </div>
                    </div>


                </div> <!-- End row -->
            </div> <!-- End section overlay -->
        </div> <!-- End content wrapper -->
    </div> <!-- End container -->
</section> <!-- END BOX CONTENT -->
