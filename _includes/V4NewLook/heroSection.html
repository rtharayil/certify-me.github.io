<section id="hero-7" class="gr--perl hero-section">
    <div class="hero-overlay">
        <div class="container">
            <div class="row d-flex align-items-center">


                <!-- HERO TEXT -->
                <div class="col-md-6">
                    <div class="hero-7-txt">

                        <!-- Title -->
                        <h1 class="s-42 w-700" style="padding-bottom: 30px;">{{page.HeroTitle}}</h1>

                        <p class="p-lg">{{page.HeroText}}
                        </p>
                        <!-- Buttons https://certifyme.online/img/CmeVedioS.mp4 -->
                        <div class="btns-group">
                            <a href="https://info.certifyme.online/request-demo" target="_blank"

                                class=" btn r-04 btn--tra-black hover--blue-100 ico-20" rel="noopener noreferrer">Start Free Trial

                            </a>

                        <style>
                            /* Container */
.cred-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

/* Default (Desktop) */
.cred-tag {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 50px;
    background: rgba(106, 90, 205, 0.08);
    color: #282B75!important;
    border: 1px solid rgba(106, 90, 205, 0.2);
    transition: all 0.25s ease;
    white-space: nowrap;
    margin-bottom: 10px;
}

/* Hover */
.cred-tag:hover {
    background: #fbfafc;
    color: #fff;
    transform: translateY(-2px);
}



/* 📲 Tablet (balanced spacing) */
@media (min-width: 577px) and (max-width: 991px) {
    .cred-tag {
        font-size: 12.5px;
        padding: 7px 14px;
    }
}
/* Hide on mobile */
@media (max-width: 767px) {
    .cred-tags {
        display: none !important;
    }
}
                        </style>

                       <div class="btns-group cred-tags mt-4">
                        <a href="/certifyme-open-badges" target="_blank" rel="noopener noreferrer">
                            <span class="cred-tag">Open Badges 3.0 Certified</span>
                        </a>

                        <a href="/g2-leader-digital-credentials" target="_blank" rel="noopener noreferrer">

                    </div>

                <!-- HERO IMAGE -->
