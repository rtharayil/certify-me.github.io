<section id="homepage-answers" class="homepage-answers" aria-labelledby="homepage-answers-title">
  <div class="container">
    <header class="homepage-answers__header">
      <p class="homepage-answers__eyebrow">For institutional teams</p>
      <h2 id="homepage-answers-title">Digital credential questions, answered.</h2>
      <p>Clear answers about standards, verification, learner records and the examples on this page.</p>
    </header>
    <div class="homepage-answers__list">
      {% for faq in page.homepage_faqs %}
      <details class="homepage-answers__item">
        <summary><h3>{{ faq.question | escape }}</h3><span aria-hidden="true">+</span></summary>
        <div class="homepage-answers__answer">
          <p>{{ faq.answer | escape }}</p>
          <a href="{{ faq.link | escape }}">{{ faq.link_label | escape }} <span aria-hidden="true">→</span></a>
        </div>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
