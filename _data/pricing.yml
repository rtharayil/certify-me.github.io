faqs:
  - question: "How does CertifyMe pricing work?"
    answer: "CertifyMe plans are designed around the students covered per year, administrative requirements, and organizational scope. Essentials starts from 500 students per year and Professional from 1,000 students per year, with no limit on credentials issued to covered students. Enterprise requirements can be discussed with our team."
  - question: "What is the difference between recipients and credentials?"
    answer: "A recipient is a person receiving a credential. A recipient may receive multiple credentials during the subscription year, so recipient population and annual credential issuance are different measures."
  - question: "Are students counted as administrative users?"
    answer: "No. Students and other credential recipients are different from administrative users. Administrative users access the platform to manage credential programs."
  - question: "What happens if we need more credentials?"
    answer: "Essentials and Professional have no limit on credentials issued to the students covered by your subscription. If you need to cover more students, contact our team to discuss your annual student population and the appropriate subscription arrangement. Enterprise capacity is tailored by agreement."
  - question: "Can departments manage their own projects?"
    answer: "Essentials has no departments or department-management add-ons. Professional includes one department with fine-grained access to authorized department resources. Additional departments cost extra as paid recurring add-ons; they do not grant institution-wide administrative access. Enterprise governance is scoped by agreement."
  - question: "Does CertifyMe provide forensic audit logs?"
    answer: "Standard activity history is different from forensic audit logging. Discuss your audit evidence, retention and reporting requirements with our team; advanced audit scope must be confirmed in the applicable configuration and agreement."
  - question: "Can CertifyMe integrate with our existing systems?"
    answer: "CertifyMe provides API and integration capabilities for supported systems. Integration requirements depend on the systems involved, technical scope, and agreed implementation."
  - question: "Are Skills Taxonomy Mapping and Comprehensive Learner Records included?"
    answer: "These capabilities form part of the broader CertifyMe ecosystem. Their availability and commercial packaging depend on the applicable product and institutional requirements."
  - question: "Can we arrange dedicated hosting or data residency?"
    answer: "Hosting and data residency requirements can be discussed with our team. Available options depend on the deployment configuration and applicable agreement."
  - question: "Can we request a tailored enterprise proposal?"
    answer: "Yes. Contact our team to discuss credential volumes, organizational structure, integrations, governance requirements, and implementation needs."
  - question: "How many templates and administrators are included?"
    answer: "Essentials includes exactly three credential templates and one administrator. Professional includes exactly ten credential templates; confirm its administrator allowance and project capacity in your proposal. Enterprise allowances are contract-defined. Templates, projects, administrators, recipients and credentials are separate quantities."
  - question: "How are additional Professional departments billed?"
    answer: "One department is included in Professional. Additional departments are paid recurring add-ons, not a one-time purchase or a move to Enterprise. Contact our team for the applicable recurring price, billing period and department scope."
  - question: "Which plans include custom branding?"
    answer: "Essentials uses standard CertifyMe branding and has no custom-branding or white-label entitlement. Supported custom branding starts with Professional, including custom domain and email. Enterprise branding governance is defined by agreement. A custom domain or email is not the same as a custom wallet or a complete white-label deployment."
  - question: "What happens when we reach a plan limit?"
    answer: "Contact our team to agree the appropriate capacity or plan before expanding your programme. Professional supports paid recurring department add-ons. Other overage, upgrade and downgrade rules depend on your existing subscription agreement; do not assume automatic overage billing or that a plan change deletes existing records."
  - question: "What does credential verification establish?"
    answer: "QR codes and credential IDs locate a record; they are not cryptographic proof. Supported signed PDFs and structured credential proofs can establish integrity or issuer proof. Review issuer context and applicable expiry, revocation and status information. A valid signature or OTP check is not independent real-world identity verification."
  - question: "Are all integrations ready-to-enable native connectors?"
    answer: "No. The available workflow may use a documented connector, configurable API or automation, or a separately scoped custom integration. Confirm the relevant platform, permissions, data flow and implementation responsibility with our team."
  - question: "What security information can we review?"
    answer: "Review our security page and request the applicable procurement evidence, DPA, authentication controls and contractual privacy terms. Residency, retention, recovery and dedicated deployment requirements must be confirmed for your arrangement; no universal residency guarantee is implied."
  - question: "What implementation and support can be arranged?"
    answer: "Discuss discovery, migration, integration, testing, administrator training and go-live responsibilities with our team. Enterprise support, service levels and escalation arrangements are defined by contract. No fixed implementation duration or support response time is promised here."
