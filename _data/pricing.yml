solutions:
  heading: "Extend your credential infrastructure"
  copy: "Build on trusted digital credentials with capabilities that connect achievements to skills, learner records, and workforce context."
  note: "These related capabilities and modules are not automatically included in core plans. Availability and commercial packaging depend on the applicable product and institutional requirements."
  cta: "Explore Institutional Solutions"
  cta_href: "/platform-overview"
  cards:
    - title: "Skills Taxonomy Mapping"
      headline: "Connect learning outcomes to skills."
      description: "Relate institution-defined learning outcomes, credentials, and evidence to reviewed skills and competency frameworks."
      href: "/skills-taxonomy-mapping"
      link: "Explore Skills Taxonomy Mapping"
    - title: "Comprehensive Learner Record"
      headline: "Bring achievements together."
      description: "Connect credentials, skills, projects, experiences, and other learning evidence in a structured learner record while preserving their origins."
      href: "/comprehensive-learner-record"
      link: "Explore Comprehensive Learner Records"
    - title: "Workforce Intelligence"
      headline: "Add workforce context to learning."
      description: "Relate reviewed skills and learner-record context to occupations and labour-market information from appropriate external sources."
      href: "/workforce-intelligence"
      link: "Explore Workforce Intelligence"
    - title: "Skill Passport and transcript management"
      headline: "Support the wider learner journey."
      description: "Skill Passport is available only as an optional add-on to Professional and Enterprise, not Essentials. Explore connected learner records and transcript-management workflows designed for institutional needs."
      href: "/solutions/skill-passport"
      transcript_href: "/transcript-management"
      link: "Explore Skill Passport"
      transcript_link: "Explore transcript management"
enterprise:
  heading: "Complex requirements? Let's design the right configuration."
  copy: "Large institutions often need more than a standard subscription. CertifyMe can discuss organizational complexity, advanced governance, integrations, credential volumes, hosting arrangements, and contractual service requirements as part of an institution-specific proposal."
  cta: "Talk to Our Enterprise Team"
  href: "https://info.certifyme.online/request-demo"
  capabilities:
    - "Multi-department and multi-project operations."
    - "Advanced access governance and auditability."
    - "Enterprise APIs and integrations."
    - "Higher credential volumes."
    - "Hosting and data residency requirements."
    - "Implementation, onboarding, and contractual support."
faqs:
  - question: "How does CertifyMe pricing work?"
    answer: "CertifyMe plans are designed around the students covered per year, administrative requirements, and organizational scope. Essentials starts from 500 students per year and Professional from 1,000 students per year, with no limit on credentials issued to covered students. Enterprise requirements can be discussed with our team."
  - question: "What is the difference between recipients and credentials?"
    answer: "A recipient is a person receiving a credential. A recipient may receive multiple credentials during the subscription year, so recipient population and annual credential issuance are different measures."
  - question: "Are students counted as administrative users?"
    answer: "No. Students and other credential recipients are different from administrative users. Administrative users access the platform to manage credential programs."
  - question: "What happens if we need more credentials?"
    answer: "Essentials and Professional have no limit on credentials issued to the students covered by your subscription. If you need to cover more students, contact our team to discuss your annual student population and the appropriate subscription arrangement. Enterprise capacity is tailored by agreement."
  - question: "Can departments manage their own projects?"
    answer: "CertifyMe supports project-management and administrative-access capabilities. The available permissions depend on the applicable configuration and subscription arrangement."
  - question: "Does CertifyMe provide forensic audit logs?"
    answer: "CertifyMe provides administrative and audit-related capabilities. Advanced forensic audit functionality and its specific scope are available according to the applicable enterprise configuration."
  - question: "Can CertifyMe integrate with our existing systems?"
    answer: "CertifyMe provides API and integration capabilities for supported systems. Integration requirements depend on the systems involved, technical scope, and agreed implementation."
  - question: "Are Skills Taxonomy Mapping and Comprehensive Learner Records included?"
    answer: "These capabilities form part of the broader CertifyMe ecosystem. Their availability and commercial packaging depend on the applicable product and institutional requirements."
  - question: "Can we arrange dedicated hosting or data residency?"
    answer: "Hosting and data residency requirements can be discussed with our team. Available options depend on the deployment configuration and applicable agreement."
  - question: "Can we request a tailored enterprise proposal?"
    answer: "Yes. Contact our team to discuss your credential volumes, organizational structure, integrations, governance requirements, and implementation needs."
final:
  heading: "Let's design the right credential infrastructure for your institution."
  copy: "Tell us about your credential programs, recipient population, expected issuance volume, integrations, and governance requirements. Our team will help identify the appropriate plan and discuss any additional capabilities you may need."
  primary_cta: "Discuss Your Requirements"
  primary_href: "https://info.certifyme.online/request-demo"
  secondary_cta: "Explore the Platform"
  secondary_href: "/solutions/digital-credential-infrastructure"
