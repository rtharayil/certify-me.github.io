plans:
  - name: Essentials
    key: essentials
    audience: "For smaller teams and credential programs"
    headline: "Trusted digital credentials, made simple."
    description: "Issue and manage trusted digital credentials with the essential tools needed to run a credential program. Designed for smaller institutions, individual departments, training providers, and organizations beginning their digital credential journey."
    capacity:
      credentials: "No limit"
      recipients: "From 500 onwards"
      administrators: "Up to 2"
      departments: "1"
      projects: "Up to 3"
    bullets:
      - "Create and issue digital credentials."
      - "Issue credentials individually or in bulk."
      - "Enable digital credential access and sharing."
      - "Support credential verification."
      - "Monitor credential activity through standard analytics."
      - "Manage credential programs with essential administrative controls."
    note: "No limit on credentials issued to the students covered by your annual subscription."
    cta: "Discuss Your Requirements"
    href: "https://info.certifyme.online/request-demo"
    commercial_approval_status: pending
    entitlements:
      - "Credential creation and management."
      - "Credential template management."
      - "Individual credential issuance."
      - "Bulk credential issuance."
      - "Digital credential access and sharing."
      - "QR and URL-based credential access."
      - "Supported credential verification."
      - "Standard credential lifecycle management."
      - "Standard analytics and reporting."
      - "Essential administrative controls."
      - "Standard platform security."
      - "Standard support resources."
  - name: Professional
    key: professional
    audience: "For multi-team credential operations"
    badge: "Recommended for growing institutions"
    headline: "Manage credential programs across teams."
    description: "Coordinate credential operations across departments and projects with clearer administrative ownership, project-level access controls, and expanded reporting and integration capabilities. Designed for universities, professional bodies, and organizations managing multiple credential programs."
    capacity:
      credentials: "No limit"
      recipients: "From 1,000 onwards"
      administrators: "Up to 10"
      departments: "Up to 10"
      projects: "Up to 25"
    bullets:
      - "Everything in Essentials."
      - "Manage multiple departments and projects."
      - "Organize credential programs using folders."
      - "Assign users to specific projects."
      - "Apply project-level access controls and permissions."
      - "Gain expanded visibility into credential activity and program performance."
    note: "Designed for institutions managing multiple credential programs, departments, and administrative teams."
    cta: "Discuss Your Requirements"
    href: "https://info.certifyme.online/request-demo"
    commercial_approval_status: pending
    entitlements:
      - "Everything in Essentials, plus:"
      - "Multiple department management."
      - "Expanded project management."
      - "Folder-based organization."
      - "Project-level user assignment."
      - "Project-scoped roles and permissions."
      - "Expanded administrative governance."
      - "Searchable activity history and standard audit trails."
      - "Expanded analytics and reporting."
      - "Expanded API and integration capabilities."
      - "Institutional branding options."
      - "Custom domain."
      - "Custom email branding."
      - "Skill Passport access as an optional add-on."
      - "More flexible credential-program administration."
      - "Expanded onboarding and support options according to the approved commercial package."
  - name: Enterprise
    key: enterprise
    audience: "For institution-wide and complex deployments"
    headline: "Institution-wide governance and scale."
    description: "Manage digital credential infrastructure across complex organizational structures with advanced governance, forensic audit capabilities, enterprise integrations, and tailored deployment arrangements. Designed for universities, government organizations, large professional bodies, and enterprises with complex operational requirements."
    capacity:
      credentials: "Custom"
      recipients: "Custom"
      administrators: "Contract-defined"
      departments: "Contract-defined"
      projects: "Contract-defined"
    bullets:
      - "Institution-wide credential operations."
      - "Advanced governance and access controls."
      - "Forensic audit logging capabilities."
      - "Enterprise integration and automation options."
      - "Tailored hosting and data residency arrangements."
      - "Custom implementation, service, and support agreements."
    note: "Enterprise capacity and capabilities are tailored to your institution's operational, technical, and governance requirements."
    cta: "Talk to Our Enterprise Team"
    href: "https://info.certifyme.online/request-demo"
    commercial_approval_status: pending
    entitlements:
      - "Institution-wide credential administration."
      - "Custom domain."
      - "Custom email branding."
      - "Skill Passport access as an optional add-on."
      - "Contract-defined organizational capacity."
      - "Advanced access governance."
      - "Forensic audit logging."
      - "Advanced audit reporting where available."
      - "Enterprise identity integration and SSO where supported."
      - "Advanced API and integration requirements."
      - "Custom integration work."
      - "Custom workflows where supported."
      - "Enterprise onboarding and training."
      - "Security review assistance where available."
      - "Custom SLA and DPA arrangements subject to agreement."
      - "Dedicated hosting or deployment options where offered."
      - "Data residency arrangements where available."
      - "Tailored implementation and support."
