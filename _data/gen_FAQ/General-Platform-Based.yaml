- Q: How do I create an account on CertifyMe?
  A: |
    <ol>
        <li>
            <p>Use your institution's assigned sign-up route or the
                <a href='https://credential.certifyme.online/auth/register/' target='_blank' rel='noopener noreferrer'>registration page</a>.
            </p>
        </li>
        <li>
            <p>If your organisation manages account access, ask its administrator
                whether you need an invitation.
            </p>
        </li>
        <li>
            <p>You will be directed to the Sign Up or account creation page.
                Follow the displayed requirements for your work account. Complete the
                “I am not a robot” check if it is shown.
            </p>
        </li>
        <li>
            <p>You will be redirected to our <a href='https://apac.platform.certifyme.org/auth/register/' target='_blank'>Registration page</a>. Fill in all the essential details here and press the Register button.
            </p>
        </li>
    </ol>
    <p>You are now ready to access your CertifyMe dashboard and start issuing and managing your credentials.
        If you encounter any issues during the account creation process,
        please reach out to our support team for assistance at
        <a href='https://info.certifyme.online/talk-with-expert' target='_blank'>info@certifyme.online</a>.
    </p>

- Q: Can I see a demo?
  A: "<p>Yes. Check the demo <a href='https://info.certifyme.online/request-demo' target='_blank'>here</a>!</p>"

- Q: How do I update my account information, such as my name or email address?
  A: "<p>For the first-time registration protocol, you can update your
        information from the Registration page <a href='https://apac.platform.certifyme.org/auth/register/' target='_blank'>here</a>. For already registered customers, they can get in touch with the customer support team <a href='https://info.certifyme.online/talk-with-expert' target='_blank'>here</a>
        for assistance or they can mail at <i>info@certifyme.online</i></p>"

- Q: Can I add or remove recipient details from my CertifyMe account?
  A: |
    <p>Yes. At any point in time, if you want to remove a recipient from
        your list or want to reclaim his/her credentials, you can do it from
        your CertifyMe account. Login > Click on the template/s under which
        the awardee/s is/are registered > Scroll down to the List of
        awardees section > Click on the box in front of the name of the
        awardee and click on the RED, DELETE button.
    </p>

- Q: I can’t activate my CertifyMe account.
  A: |
    <p>Check the institution's assigned login route and any invitation or confirmation email,
        including the spam folder. If access is organisation-managed, ask the administrator
        to confirm your access. If the issue persists, describe the error and
        <a href="https://info.certifyme.online/talk-with-expert" target='_blank' rel="noopener noreferrer">contact the CertifyMe team</a>.
        Do not include passwords or sensitive recipient data.
    </p>

- Q: How to reset your password on CertifyMe?
  A: |
    "To reset your password on CertifyMe, follow these steps:
    <br>
    <ol>
        <li><strong>Visit the CertifyMe Website</strong>: Open your web browser
            and go to the <u><strong><a href='https://www.certifyme.online/'>certifyme.online</a></strong></u>.
        </li>
        <li><strong>Click on 'Login'</strong>: Locate the <u><strong><a href='https://apac.platform.certifyme.org/auth/login'>'Login'</a></strong></u>
            button on the website's homepage and click on it to access the login page.
        </li>
        <li><strong>Click on 'Forgot Password?'</strong>: On the login page, you'll
            find an option that says <strong>'Forgot Password?'</strong>. Click on this link to initiate the
            password reset process.
        </li>
        <li><strong>Enter Your Email Address</strong>: You'll be prompted to enter
            the email address associated with your CertifyMe account. Enter the email
            address and click on the <strong>'Reset Password'</strong> button.
        </li>
        <li><strong>Check Your Email</strong>: CertifyMe will send you an email
            with instructions on how to reset your password. Open your email inbox and
            look for the email from CertifyMe.
        </li>
        <li><strong>Follow the Instructions</strong>: In the email from CertifyMe,
            you'll find a link to reset your password. Click on the link and follow the
            instructions provided to create a new password for your account.
        </li>
        <li><strong>Reset Your Password</strong>: Once you click on the reset
            password link, you'll be directed to a page where you can enter a new
            password for your CertifyMe account. Enter your new password and confirm
            it.
        </li>
        <li><strong>Log In</strong>: After successfully resetting your password, you
            can now log in to your CertifyMe account using your new password.
        </li>
    </ol>
    By following these steps, you can easily reset your password on CertifyMe and
    regain access to your account.
    <br>
    <u><strong><a href='https://youtu.be/d27e4PWeATE'>Click here for Video Demonstration</a></strong></u>"

- Q: Is CertifyMe a cloud-based platform?
  A: "Yes, CertifyMe is a cloud-based platform. This means you can access it from anywhere with an internet connection, without the need for any local software installation which ensures flexibility and convenience."

- Q: What browsers are compatible with CertifyMe?
  A: "CertifyMe is compatible with all modern web browsers, including Google Chrome, Mozilla Firefox, Microsoft Edge, Safari, and Opera. For the best experience, we recommend using the latest version of your preferred browser."

- Q: Does CertifyMe offer mobile apps for credential issuance?
  A: "Currently, CertifyMe does not offer dedicated mobile apps for credential issuance. However, the platform is fully responsive and can be accessed through mobile web browsers, allowing you to issue and manage credentials on the go."

- Q: Can CertifyMe be accessed offline?
  A: "No, CertifyMe requires an active internet connection to access and use its features. Being a cloud-based platform, it relies on online connectivity for issuing, managing, and verifying digital credentials."

- Q: How does CertifyMe handle backups and data recovery?
  A: "CertifyMe employs robust data backup and recovery protocols. Data is backed up on a periodic basis to ensure that it can be restored in case of any unforeseen events. These backups are securely stored and can be quickly accessed to recover lost or damaged data."

- Q: How does CertifyMe handle system updates and maintenance?
  A: |
    "CertifyMe handles system updates and maintenance automatically. Regular
    updates are deployed to ensure the platform remains secure, efficient, and
    equipped with the latest features. These updates typically occur with minimal
    disruption to users.
    Further, if there are any feature enhancements and updates of the platform the
    same is intimated to the customers as part of regular updates."

- Q: Can CertifyMe be accessed from multiple devices simultaneously?
  A: "Use approved devices with your own account. Concurrent access depends on the institution's session, SSO and security configuration. Follow its access policy and do not share administrator credentials."

- Q: Is CertifyMe GDPR compliant and holds the required ISO certifications?
  A: "CertifyMe publishes security and privacy assurance information on its security page. Review the current certificate scopes, applicable data-processing terms and controls for your institution. A management-system certificate does not establish every GDPR obligation or every regulator's required controls."
