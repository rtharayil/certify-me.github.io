- Q: What kind of technical support is available for institutions and students?
  A: Use the support channels and response coverage agreed for the institution's implementation. The registrar handles academic-record decisions; platform support handles technical issues.
  c: 1
- Q: How do I contact EduTranscript customer support?
  A: Use your institution's agreed support channel. If you need to identify the appropriate contact, email CertifyMe's published team address at info@certifyme.online. Do not send passwords or unnecessary student information.
  c: 2
- Q: What should I do if there’s an issue with transcript issuance or verification?
  A: Identify whether the problem concerns the academic record, delivery or verification. Ask the issuing institution to review record details; provide the technical team with the relevant link and a concise error description using the agreed secure channel.
  c: 3
- Q: What should I do if my transcript request is delayed?
  A: Ask the registrar whether the transcript has been approved and issued. If it has, check delivery status and any recipient requirements before escalating a technical delivery issue.
  c: 4
- Q: What should I do if my transcript isn’t received by the recipient university or employer?
  A: Confirm the recipient address and accepted delivery method with the issuing institution. Check delivery status before requesting an authorised resend; do not create an unofficial replacement record.
  c: 5
- Q: What if I am unable to verify a transcript through EduTranscript?
  A: Check the supplied link, issuer information and displayed status. Record the error and use the institution's verification process. A failed access attempt is not by itself proof that the academic record is fraudulent.
  c: 6
