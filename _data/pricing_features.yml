      headline: "Bring achievements together."
      description: "Connect credentials, skills, projects, experiences, and other learning evidence in a structured learner record while preserving issuer context. Available only with Enterprise, subject to agreed module scope; sharing and learner-record evidence require their relevant agreed scopes."
