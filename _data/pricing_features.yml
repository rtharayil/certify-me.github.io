faqs:
  - question: "How does CertifyMe pricing work?"
    answer: "All CertifyMe plans start from a minimum of 250 students per year. Your subscription also reflects administrative requirements and organizational scope. Essentials and Professional have no limit on credentials issued to covered students. Enterprise requirements can be discussed with our team."
  - question: "What is the difference between recipients and credentials?"
    answer: "A recipient is a person receiving a credential. A recipient may receive multiple credentials during the subscription year, so recipient population and annual credential issuance are different measures."
  - question: "Are students counted as administrative users?"
    answer: "No. Students and other credential recipients are different from administrative users. Administrative users access the platform to manage credential programs."
  - question: "What happens if we need more credentials?"
    answer: "Essentials and Professional have no limit on credentials issued to the students covered by your subscription. If you need to cover more students, contact our team to discuss your annual student population and the appropriate subscription arrangement. Enterprise capacity is tailored by agreement."
  - question: "Can departments manage their own projects?"
    answer: "Essentials has no departments or department-management add-ons. Professional includes one department with fine-grained access and export access for authorized resources, subject to existing permissions. Project-level user assignment and project-scoped permissions are not included in Essentials or Professional; they are available only with Enterprise, subject to the agreed project access and permission scopes. Additional Professional departments cost extra as paid recurring add-ons; they do not grant cross-department or institution-wide administrative access. Institution-wide administration is available only with Enterprise, subject to agreed governance. Folders are available across all three plans."
  - question: "Does CertifyMe provide forensic audit logs?"
    answer: "Administrative audit trails and credential lifecycle history are distinct from forensic audit logging. Essentials does not include a plan-specific administrative audit-trail feature. Professional includes basic administrative audit trails; Enterprise includes advanced administrative audit trails. Credential lifecycle history and audit records are not included in Essentials, are an optional paid add-on for Professional, and are included with Enterprise subject to agreed audit and retention scope. Contact our team for the approved add-on configuration and commercial terms; purchasing the Professional lifecycle history add-on does not grant other Enterprise entitlements. Advanced trails do not automatically establish a forensic logging capability. Confirm forensic scope, retention and reporting requirements for the applicable configuration and agreement."
  - question: "Can CertifyMe integrate with our existing systems?"
    answer: "Basic APIs and CSV data import are available across all three plans, with CSV import supporting issuance-import workflows. Advanced APIs are available from Professional onward. Reporting API access is a separate feature available only with Enterprise. Webhooks, documented LMS connectors or plugins, SIS/HRIS and institutional integrations, and custom integrations or plugins are available only with Enterprise. LMS connectors require an agreed connector and implementation scope; institutional and custom integrations require an agreed scope. API availability does not imply any particular rate limit or usage quota."
  - question: "Are Skills Taxonomy Mapping and Comprehensive Learner Records included?"
    answer: "Institution-defined skills and outcomes are available across all three plans. ESCO, O*NET and institutional framework mapping is available from Professional, subject to reviewed mapping scope; Enterprise framework and mapping scope is agreed. Credential-to-skill relationships, institutional review and approval of mappings, evidence and provenance for skill relationships, and reuse of reviewed mappings are Enterprise-only, subject to their agreed scopes. Institution-defined skills and outcomes do not automatically include these capabilities. Comprehensive Learner Record and SkillStory capabilities—including connected achievement records, CLR creation and display, learner-record sharing, achievement evidence and provenance, and Skill Passport—are not included in Essentials or Professional. Enterprise availability is subject to the relevant agreed module, sharing or learner-record scope. Transcript-management connections also require Enterprise and agreed integration scope. Basic recipient credential wallets and access to issued credentials are separate capabilities; their existing plan scope is unchanged."
  - question: "Can we arrange dedicated hosting or data residency?"
    answer: "Essentials hosts data in the APAC region only. Professional offers hosting options in APAC, EU, or US. Enterprise hosting location and data residency are agreed contractually, subject to technical feasibility, applicable law and commercial approval; no unrestricted choice of any location is promised. Dedicated deployment is available only with Enterprise, subject to agreed scope and configuration."
  - question: "Can we request a tailored enterprise proposal?"
    answer: "Yes. Contact our team to discuss credential volumes, organizational structure, integrations, governance requirements, and implementation needs."
  - question: "How many templates and administrators are included?"
    answer: "Essentials includes exactly three credential templates, one administrator and two projects. Professional includes exactly ten credential templates, five projects and two administrators per department. Enterprise template, administrator and department allowances are contract-defined; project capacity is proposal-specific. All plans start from a minimum of 250 students per year. Templates, projects, administrators, recipients and credentials are separate quantities. Template creation and editing, and both badge and certificate template libraries, are included across all plans; library access does not increase the plan's template limit. Stackable micro-credentials, learning paths, showcase directory and achievement metadata start with Professional. Credential evidence is Enterprise-only; credential design integrations are available only with Enterprise, subject to agreed integration scope."
  - question: "How are additional Professional departments billed?"
    answer: "One department is included in Professional. Additional departments are paid recurring add-ons, not a one-time purchase or a move to Enterprise. Contact our team for the applicable recurring price, billing period and department scope."
  - question: "Which plans include custom branding?"
    answer: "Essentials uses standard CertifyMe branding and does not include custom branding or white-label capabilities. Credential page branding, custom domains, white-label email, SMTP configuration, email customization, navigation and footer customization, and custom URLs are available from Professional onward. Verification page customization is available with Professional and Enterprise, subject to agreed contract scope. Organization and institution pages, OAuth for email access, and custom learner wallets are Enterprise-only. Essentials and Professional include a basic learner-facing wallet/profile; Enterprise includes the full SkillStory experience, subject to agreed Enterprise module scope. White-label email, SMTP configuration, OAuth and email customization are separate capabilities. A custom domain does not automatically include every form of white labeling."
  - question: "What happens when we reach a plan limit?"
    answer: "Contact our team to agree the appropriate capacity or plan before expanding your programme. Professional supports paid recurring department add-ons. Other overage, upgrade and downgrade rules depend on your existing subscription agreement; do not assume automatic overage billing or that a plan change deletes existing records."
  - question: "What does credential verification establish?"
    answer: "QR codes and credential IDs locate a record; they are not cryptographic proof. Supported signed PDFs and structured credential proofs can establish integrity or issuer proof. Review issuer context and applicable expiry, revocation and status information. Expiry and revocation verification remain available across all plans; checking revocation status is not permission to revoke a credential. Essentials does not include revocation, while Professional and Enterprise do. A valid signature or OTP check is not independent real-world identity verification. Smart ID tagging, OTP-based verification, signed PDF integrity verification, structured credential proof verification, Open Badges 3.0 verification and the verification widget are not included in Essentials; they start with Professional. PDF and structured-proof checks retain their supported signed configuration, proof-format and verifier distinctions. Enterprise signed PDF verification is subject to agreed signed configuration; its verification widget is subject to applicable configuration. Public verification pages use the standard CertifyMe experience in Essentials and Professional; Enterprise pages are available subject to agreed branding governance. Verification page customization is a separate entitlement, subject to agreed contract scope. Essentials uses Open Badges 2.1; Professional and Enterprise use Open Badges 3.0. W3C Verifiable Credentials and CLR 2.0 exchange formats are Enterprise-only, subject to the supported credential configuration and agreed CLR module and exchange-format scope, respectively. Credential portability remains available across all plans for supported compatible formats and receivers. Enterprise receiving-platform compatibility is subject to agreed scope, not universal external acceptance."
  - question: "Are all integrations ready-to-enable native connectors?"
    answer: "No. Google Forms automation and workflow automation through Zapier are available from Professional onward. Enterprise Google Forms automation is subject to applicable configuration, and Enterprise Zapier automation is subject to applicable workflow scope. Documented LMS connectors or plugins, SIS/HRIS and institutional integrations, and custom integrations or plugins are Enterprise-only and require the relevant agreed connector, implementation or integration scope. Availability does not mean every platform or workflow is automatically configured or requires no implementation work."
  - question: "What security information can we review?"
    answer: "Encryption in transit and at rest is included with all plans. Essentials and Professional include standard credential data security controls and a standard DPA and contractual privacy terms. Enterprise governance controls and DPA customization are subject to agreement. SSO is available only with Enterprise; MFA is included with Professional and Enterprise, not Essentials. Enterprise provides access to vulnerability-management evidence, penetration-testing documentation, and security questionnaire and procurement support. This evidence access does not imply that vulnerability management or security testing occurs only for Enterprise. Plan-specific backup and recovery commitments and customized retention, export and exit arrangements are defined by the Enterprise plan and contract. Essentials and Professional have no such plan-specific commitments or customized arrangements; this does not remove standard data rights or describe the presence or absence of underlying platform practices. Review our security page and the applicable agreement; no recovery times, report distribution rights or new certifications are promised here."
  - question: "What implementation and support can be arranged?"
    answer: "Self-service documentation and email support are available across all plans. Essentials includes self-onboarding and administrator training through online videos. Professional includes standard onboarding, one 45-minute, one-to-one online administrator training session, and a dedicated account manager. Enterprise includes white-glove onboarding and advanced administrator training. Enterprise-only services include advanced training, credential consultation, discovery and requirements definition, integration implementation, testing and user acceptance support, and go-live assistance. Enterprise migration support is subject to the agreed migration scope. A dedicated account manager is available with Professional and Enterprise. Service-level escalation is available only with Enterprise; this does not restrict email support on other plans. No fixed implementation duration or support response time is promised here."
security_clarifier: "Administrative audit trails are plan-specific: Essentials does not include this feature, Professional includes basic trails, and Enterprise includes advanced trails. Credential lifecycle history and audit records are separate: Essentials does not include them, Professional offers them as an optional paid add-on, and Enterprise includes them subject to agreed audit and retention scope. Routine activity history is not forensic audit logging; forensic scope and retention must be agreed for the applicable configuration. Backup and recovery labels describe plan-specific commitments, not the presence or absence of underlying platform practices. Customized retention and exit arrangements are separate from customers' standard data rights. Enterprise contractual arrangements depend on the agreed contract."
